name: Coverr Rupert - private footage search and transfer

# The user explicitly requested this Coverr API run. Push-to-branch is used
# because workflow_dispatch is not available for this session integration.
# Triggers require a deliberate commit marker; no cron, publish or scheduler.
on:
  push:
    branches: [arena/54cb36c6-content-creator]
    paths:
      - '.github/workflows/coverr-rupert-footage.yml'
      - 'editorial-engine/pipeline/coverr-rupert/**'

permissions:
  contents: read
  checks: write # ephemeral public-key handshake; no branch writes

jobs:
  search:
    if: ${{ contains(github.event.head_commit.message, '[approved-coverr-rupert-search]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Offline tests
        run: python3 editorial-engine/pipeline/coverr-rupert/test-search.py
      - name: Authorized Coverr API search (sanitized metadata only)
        env:
          COVERR_SECRET: ${{ secrets.COVERR_API_KEY || secrets.COVERR_VIDEO_API_KEY || secrets.COVERR_KEY }}
          COVERR_VAR: ${{ vars.COVERR_API_KEY || vars.COVERR_VIDEO_API_KEY || vars.COVERR_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          export COVERR_API_KEY="${COVERR_SECRET:-$COVERR_VAR}"
          if [ -n "$COVERR_API_KEY" ]; then echo "::add-mask::$COVERR_API_KEY"; fi
          if [ -n "$COVERR_SECRET" ]; then echo 'KEY_SOURCE=SECRET';
          elif [ -n "$COVERR_VAR" ]; then echo 'KEY_SOURCE=VARIABLE';
          else echo 'KEY_SOURCE=MISSING'; fi
          python3 editorial-engine/pipeline/coverr-rupert/search.py
  download-to-private-drive:
    if: ${{ contains(github.event.head_commit.message, '[approved-coverr-rupert-download]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY || secrets.COVERR_VIDEO_API_KEY || secrets.COVERR_KEY || vars.COVERR_API_KEY || vars.COVERR_VIDEO_API_KEY || vars.COVERR_KEY }}
      COVERR_VIDEO_ID: azy1Cd1ZeQ
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Test the private relay and cryptography
        run: node --test editorial-engine/pipeline/coverr-rupert/test-direct-drive-relay.mjs editorial-engine/pipeline/coverr-transfer/test-transfer.mjs editorial-engine/pipeline/drive-relay/test-relay.mjs
      - name: Install isolated FFprobe for source inspection
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/coverr-toolchain" --ignore-scripts --no-audit --no-fund --no-package-lock ffprobe-static@3.1.0
          FFPROBE_BIN="$RUNNER_TEMP/coverr-toolchain/node_modules/ffprobe-static/bin/linux/x64"
          "$FFPROBE_BIN/ffprobe" -version >/dev/null
          echo "$FFPROBE_BIN" >> "$GITHUB_PATH"
      - name: Fetch one approved original and send to private Drive
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COVERR_API_KEY:-}" ]; then echo "::add-mask::${COVERR_API_KEY}"; fi
          node editorial-engine/pipeline/coverr-rupert/direct-drive-relay.mjs
