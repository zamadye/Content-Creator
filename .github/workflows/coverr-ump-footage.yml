name: Coverr - UMP native HD transfer
# User-approved API-only high-resolution candidates, session branch only.
# No PR, main change, publishing, scheduling, raw media, or secrets in git.
# Excerpts are encrypted before being placed into unreferenced Git blobs in the
# public repo; garbage-collection timing is not guaranteed.
on:
  push:
    branches:
      - arena/54cb36c6-content-creator
    paths:
      - '.github/workflows/coverr-ump-footage.yml'
      - 'editorial-engine/pipeline/coverr-transfer/transfer.mjs'
      - 'editorial-engine/pipeline/coverr-transfer/session-public.pem'
permissions:
  contents: write # unreferenced encrypted blobs, not branch writes
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run offline source-quality and safety tests
        run: node --test editorial-engine/pipeline/coverr-transfer/test-transfer.mjs
      - name: Install and verify FFmpeg and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Native HD pilot - household expense tracking
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          COVERR_VIDEO_ID: 1XR9FPo67A
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${COVERR_API_KEY:-}" ]; then echo "::add-mask::${COVERR_API_KEY}"; fi
          if [ -n "${GITHUB_TOKEN:-}" ]; then echo "::add-mask::${GITHUB_TOKEN}"; fi
          node editorial-engine/pipeline/coverr-transfer/transfer.mjs
      - name: Native HD pilot - clothing work
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          COVERR_VIDEO_ID: 4EggJk9r6n
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${COVERR_API_KEY:-}" ]; then echo "::add-mask::${COVERR_API_KEY}"; fi
          if [ -n "${GITHUB_TOKEN:-}" ]; then echo "::add-mask::${GITHUB_TOKEN}"; fi
          node editorial-engine/pipeline/coverr-transfer/transfer.mjs
