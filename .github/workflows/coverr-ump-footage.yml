name: Coverr - UMP high-resolution search
# Approved by the user for this session branch only: API search and up to 20
# high-resolution candidates. No main update, PR, publishing or scheduling.
# Search emits sanitized metadata only. No key, signed URL or raw body in logs.
on:
  push:
    branches:
      - arena/54cb36c6-content-creator
    paths:
      - '.github/workflows/coverr-ump-footage.yml'
      - 'editorial-engine/pipeline/coverr-transfer/search-hq.py'
      - 'editorial-engine/pipeline/coverr-transfer/test-search-hq.py'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Run offline safety tests
        run: |
          python3 editorial-engine/pipeline/coverr-transfer/test-search-hq.py
          node --test editorial-engine/pipeline/coverr-transfer/test-transfer.mjs
      - name: Search Coverr API for relevant candidate metadata
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COVERR_API_KEY:-}" ]; then echo "::add-mask::${COVERR_API_KEY}"; fi
          python3 editorial-engine/pipeline/coverr-transfer/search-hq.py
