name: One-time private Drive relay
# Separate user approval covers a test and, if safe, one UMP master upload.
# This branch and an explicit marker are both required. No Drive credential,
# media, runner private key or bearer token is committed or printed. The
# preauthorized session URI reaches the runner only inside an RSA/AES envelope.
# The public preview host serves only encrypted handshake data and authenticated
# HTTPS byte ranges; the owner stops it immediately after the transfer.
on:
  push:
    branches:
      - arena/54cb36c6-content-creator
    paths:
      - '.github/workflows/drive-hq-relay.yml'
      - 'editorial-engine/pipeline/drive-relay/**'
permissions:
  contents: read
jobs:
  one-time-relay:
    if: ${{ contains(github.event.head_commit.message, '[approved-drive-relay]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Offline cryptographic and endpoint tests
        run: node --test editorial-engine/pipeline/drive-relay/test-relay.mjs
      - name: One-time encrypted session handshake and resumable upload
        shell: bash
        run: |
          set -euo pipefail
          node editorial-engine/pipeline/drive-relay/relay-upload.mjs
