name: One-time encrypted Drive relay
# Explicit user approval covers encrypted unreferenced Git blobs for one UMP
# master. The repo is public; ciphertext may survive until GitHub GC. A new
# job requires both this branch and a deliberate trigger marker. No Drive URI,
# plaintext media, or private key is committed or logged. Runner key is
# ephemeral; the resulting private Drive file ID is encrypted for the owner.
on:
  push:
    branches:
      - arena/54cb36c6-content-creator
    paths:
      - '.github/workflows/drive-hq-relay.yml'
      - 'editorial-engine/pipeline/drive-relay/**'
permissions:
  contents: read
jobs:
  one-time-relay:
    if: ${{ contains(github.event.head_commit.message, '[approved-drive-relay]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Offline cryptographic and endpoint tests
        run: node --test editorial-engine/pipeline/drive-relay/test-relay.mjs
      - name: Encrypted blob handshake and resumable upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_TOKEN:-}" ]; then echo "::add-mask::${GITHUB_TOKEN}"; fi
          node editorial-engine/pipeline/drive-relay/relay-upload.mjs
