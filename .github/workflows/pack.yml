name: KNOT THEORY · Zernio media pack
on:
  push:
    branches: [codex/pack-optika-07e0c04c]
    paths: [.github/workflows/pack.yml]
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Prepare two file-specific uploads in Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PACK_RECIPIENT: 
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {publicEncrypt, randomBytes, createCipheriv, constants} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const files = [
            {name:'dindingnya-putih.mp4', size:3733533},
            {name:'dindingnya-putih-fb-reel.mp4', size:2156374}
          ];
          if (!process.env.ZERNIO_API_KEY) throw Error('No Zernio connection');
          const outputs = [];
          for (const file of files) {
            const res = await fetch('https://zernio.com/api/v1/media/presign', {
              method:'POST', redirect:'error', signal:AbortSignal.timeout(20000),
              headers:{Authorization:'Bearer '+process.env.ZERNIO_API_KEY, 'Content-Type':'application/json'},
              body:JSON.stringify({filename:file.name,contentType:'video/mp4',size:file.size})
            });
            if (!res.ok) throw Error('Zernio presign returned HTTP '+res.status);
            const reply=await res.json();
            const data=reply.data ?? reply;
            const destination=new URL(data.uploadUrl), result=new URL(data.publicUrl);
            if(destination.protocol!=='https:' || result.protocol!=='https:') throw Error('Invalid media URLs');
            outputs.push({name:file.name,uploadUrl:destination.href,publicUrl:result.href});
          }
          const aes=randomBytes(32), iv=randomBytes(12);
          const cipher=createCipheriv('aes-256-gcm',aes,iv);
          const ciphertext=Buffer.concat([cipher.update(JSON.stringify(outputs),'utf8'),cipher.final()]);
          const wrapped=publicEncrypt({key:Buffer.from(process.env.PACK_RECIPIENT,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},aes);
          const envelope=Object.fromEntries(Object.entries({wrapped,iv,tag:cipher.getAuthTag(),ciphertext}).map(([k,v])=>[k,v.toString('base64')]));
          writeFileSync('pack.json',JSON.stringify(envelope),{mode:0o600});
          JS
      - name: Return the sealed upload addresses to the laptop
        uses: actions/upload-artifact@v4
        with:
          name: knot-optika-upload-addresses
          path: pack.json
          retention-days: 1
