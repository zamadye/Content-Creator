name: Publish ke Buffer

# ---------------------------------------------------------------------------
#  Kenapa ini ada: api.buffer.com tidak bisa dihubungi dari sandbox Arena,
#  tetapi runner GitHub punya internet penuh. Jadi seluruh panggilan Buffer
#  dijalankan di sini, dan Anda cukup klik "Run workflow" di tab Actions.
#
#  Tombol "Run workflow" hanya terlihat oleh yang punya akses tulis ke repo,
#  jadi kunci di Secrets tidak bisa dipakai orang luar meski repo publik.
#  Jangan pernah menambahkan pemicu `pull_request` / `pull_request_target`
#  pada workflow ini — itu jalan dari fork dan tidak punya akses secret,
#  tetapi tetap jangan diberi kesempatan.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      mission:
        description: 'Slug misi (tanpa prefix B_/T_)'
        required: true
        default: pinjol-bunga-harian-2026
      aksi:
        description: 'validasi = hanya cek payload; kirim = benar-benar mengirim'
        type: choice
        required: true
        default: validasi
        options:
          - validasi
          - kirim
      platforms:
        description: 'Daftar platform, dipisah koma'
        required: true
        default: 'instagram,facebook,tiktok,youtube'
      mode:
        description: 'Mode penjadwalan Buffer'
        type: choice
        required: true
        default: addToQueue
        options:
          - addToQueue
          - shareNow
          - shareNext

permissions:
  contents: read

concurrency:
  group: buffer-publish
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.aksi }} · ${{ inputs.mission }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Periksa prasyarat
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          # sembunyikan nilai rahasia dari log sejak awal
          [ -n "${BUFFER_API_KEY:-}" ] && echo "::add-mask::${BUFFER_API_KEY}"
          [ -n "${BUFFER_ORGANIZATION_ID:-}" ] && echo "::add-mask::${BUFFER_ORGANIZATION_ID}"

          gagal=0
          [ -n "${BUFFER_API_KEY:-}" ] || { echo "::error::Secret BUFFER_API_KEY belum diisi (Settings → Secrets and variables → Actions)."; gagal=1; }
          [ -n "${BUFFER_ORGANIZATION_ID:-}" ] || { echo "::error::Secret BUFFER_ORGANIZATION_ID belum diisi. Ambil dari buffer context atau dashboard Buffer."; gagal=1; }
          [ "$gagal" -eq 0 ] || exit 1

      - name: Pasang CLI Buffer
        run: |
          npm i -g @bufferapp/cli
          buffer --version

      - name: Pastikan berkas misi ada
        env:
          MISSION: ${{ inputs.mission }}
        run: |
          set -euo pipefail
          cd editorial-engine
          for f in "deliverables/B_${MISSION}_1080x1920.mp4" \
                   "deliverables/T_${MISSION}_1080x1920.png" \
                   "deliverables/caption_${MISSION}.txt"; do
            [ -f "$f" ] || { echo "::error::Berkas $f tidak ditemukan di commit ini."; exit 1; }
            printf '%-60s %10s B\n' "$f" "$(stat -c%s "$f")"
          done

      - name: Tentukan URL media publik
        id: media
        env:
          MISSION: ${{ inputs.mission }}
        run: |
          set -euo pipefail
          # Pakai SHA commit, bukan nama branch: URL jadi permanen dan tidak
          # ambigu walau branch mengandung garis miring.
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/editorial-engine/deliverables/B_${MISSION}_1080x1920.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "URL: $URL"
          echo ""
          # Runner punya internet penuh, jadi verifikasi ini benar-benar nyata —
          # inilah tempat pertanyaan "content-type apa dari raw.githubusercontent?"
          # dijawab dengan bukti, bukan dugaan.
          curl -sSIL "$URL" | grep -Ei '^(HTTP/|content-type:|content-length:)' || true

      - name: Validasi / kirim ke Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          MEDIA_URL: ${{ steps.media.outputs.url }}
          MODE: ${{ inputs.mode }}
          YOUTUBE_CATEGORY_ID: '27'
        run: |
          set -euo pipefail
          echo "::add-mask::${BUFFER_API_KEY}"
          ARGS=(--mission "${{ inputs.mission }}" --platforms "${{ inputs.platforms }}")
          if [ "${{ inputs.aksi }}" = "kirim" ]; then
            ARGS+=(--send)
          fi
          printf 'node pipeline/publish-buffer.mjs %s\n\n' "${ARGS[*]}"
          cd editorial-engine
          node pipeline/publish-buffer.mjs "${ARGS[@]}"

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Buffer · ${{ inputs.aksi }} · ${{ inputs.mission }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| platform | ${{ inputs.platforms }} |"
            echo "| mode | ${{ inputs.mode }} |"
            echo "| media | ${{ steps.media.outputs.url }} |"
            echo "| hasil | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
