name: Publikasikan terjadwal

# ---------------------------------------------------------------------------
#  Tombol publikasi = mengubah .github/publish-request.json lalu push.
#  Dipakai `push: paths` (bukan hanya workflow_dispatch) karena tombol
#  "Run workflow" baru muncul setelah workflow ini ada di default branch.
#
#  Tiap entri dijadwalkan `customScheduled` + `dueAt` ber-offset, jadi jeda
#  antar-konten ditentukan berkas itu, bukan panjang antrean Buffer.
# ---------------------------------------------------------------------------

on:
  push:
    paths:
      - '.github/publish-request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buffer-publish
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Ada secret?
        id: s
        env:
          KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${KEY:-}" ] && echo "::add-mask::${KEY}"
          if [ -z "${KEY:-}" ]; then
            echo "::error::Secret BUFFER_API_KEY belum diisi."
            exit 1
          fi
          echo "ada=1" >> "$GITHUB_OUTPUT"

      - name: Pasang CLI Buffer
        run: |
          npm i -g @bufferapp/cli
          buffer --version

      - name: Tampilkan rencana
        run: |
          node -e '
            const r = require("./.github/publish-request.json");
            console.log("aksi     :", r.aksi);
            console.log("platform :", r.platforms);
            for (const it of r.items) console.log("  -", it.mission, "@", it.dueAt);
          ' | tee /tmp/rencana.txt

      - name: Kirim / validasi
        id: kirim
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          YOUTUBE_CATEGORY_ID: '27'
          NO_COLOR: '1'
        run: |
          set -uo pipefail
          node -e '
            const r = require("./.github/publish-request.json");
            for (const it of r.items) console.log([it.mission, it.dueAt].join("\t"));
          ' > /tmp/plan.tsv
          PLATFORMS=$(node -p 'require("./.github/publish-request.json").platforms')
          AKSI=$(node -p 'require("./.github/publish-request.json").aksi')

          : > /tmp/hasil.txt
          FAIL=0
          while IFS=$'\t' read -r mission due; do
            [ -z "${mission:-}" ] && continue

            media="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/editorial-engine/deliverables/B_${mission}_1080x1920.mp4"
            args=(--mission "$mission" --platforms "$PLATFORMS")
            [ "$AKSI" = "kirim" ] && args+=(--send)

            echo "" >> /tmp/hasil.txt
            echo "########## ${mission} @ ${due}" >> /tmp/hasil.txt

            MEDIA_URL="$media" MODE=customScheduled DUE_AT="$due" \
              node editorial-engine/pipeline/publish-buffer.mjs "${args[@]}" > /tmp/satu.txt 2>&1 \
              || FAIL=1

            grep -E "^(org |media |✓|  ⚠|✗|=== ringkasan|TERKIRIM|GAGAL|SKIP|INVALID|VALID)" /tmp/satu.txt >> /tmp/hasil.txt || true
          done < /tmp/plan.tsv

          echo "FAIL=$FAIL" >> "$GITHUB_OUTPUT"
          exit "$FAIL"

      - name: Verifikasi antrean
        if: always()
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          NO_COLOR: '1'
        run: |
          set -uo pipefail
          buffer account --fields organizations.id --output json --quiet > /tmp/acc.json 2>/dev/null || true
          ORG=$(node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync("/tmp/acc.json","utf8"));const o=j.account?.organizations??j.organizations??[];console.log(o[0]?.id||"")}catch{console.log("")}')
          if [ -z "${ORG:-}" ]; then echo "tidak bisa membaca organizationId" > /tmp/verif.txt; exit 0; fi

          buffer posts list --organization-id "$ORG" --fields 'items.{id,text,dueAt,status}' --output json --quiet > /tmp/posts.json 2>/dev/null \
            || buffer posts list --organization-id "$ORG" --output json --quiet > /tmp/posts.json 2>/dev/null || true

          node -e '
            const fs = require("fs");
            let arr = [];
            try {
              const j = JSON.parse(fs.readFileSync("/tmp/posts.json", "utf8"));
              arr = j.items ?? j.posts ?? [];
              if (!arr.length) {
                const find = (n) => {
                  if (!n || typeof n !== "object") return null;
                  if (Array.isArray(n) && n.length && n.every((x) => x && ("dueAt" in x || "status" in x))) return n;
                  for (const v of Object.values(n)) { const h = find(v); if (h) return h; }
                  return null;
                };
                arr = find(j) || [];
              }
            } catch {}
            console.log("total post di Buffer:", arr.length);
            for (const p of arr) {
              console.log(" ", String(p.status ?? "?").padEnd(10), String(p.dueAt ?? "").padEnd(26), String(p.text ?? "").slice(0, 40).replace(/\n/g, " "));
            }
          ' | tee /tmp/verif.txt

      - name: Terbitkan hasil sebagai anotasi
        if: always()
        run: |
          cat /tmp/rencana.txt /tmp/hasil.txt /tmp/verif.txt 2>/dev/null > /tmp/gabung.txt || true
          [ -s /tmp/gabung.txt ] || exit 0
          tail -c 50000 /tmp/gabung.txt > /tmp/gabung-kecil.txt
          node -e '
            const fs = require("fs");
            let t = fs.readFileSync("/tmp/gabung-kecil.txt", "utf8");
            t = t.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            console.log("::notice title=Hasil publikasi Buffer::" + t);
          '

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## Publikasi Buffer"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| status | ${STATUS} |"
            echo ""
            echo '```'
            cat /tmp/gabung.txt 2>/dev/null | tail -c 20000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STATUS: ${{ steps.kirim.outputs.FAIL == '0' && 'semua berhasil' || 'ada platform yang gagal — lihat anotasi' }}
