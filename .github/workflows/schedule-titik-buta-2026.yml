name: KNOT Titik Buta — jadwal FB dan YouTube

# Explicit user approval is required before modifying the request and pushing.
# The public repository contains only code, copy, dates and a user-approved
# temporary public media URL. Never add the MP4 or credentials to Git.
on:
  push:
    branches:
      - arena/54cb36c6-content-creator
    paths:
      - '.github/titik-buta-2026-schedule-request.json'

permissions:
  contents: read

concurrency:
  group: buffer-publish
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install pinned Buffer CLI
        run: npm install --global @bufferapp/cli@2.2.0 --no-audit --no-fund
      - name: Preflight or schedule approved posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          KNOT_REPORT_PATH: /tmp/knot-titik-buta-schedule-report.json
          NO_COLOR: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BUFFER_API_KEY:-}" ]; then echo "::add-mask::${BUFFER_API_KEY}"; fi
          if [ -n "${BUFFER_ORGANIZATION_ID:-}" ]; then echo "::add-mask::${BUFFER_ORGANIZATION_ID}"; fi
          node editorial-engine/pipeline/schedule-titik-buta-2026.mjs .github/titik-buta-2026-schedule-request.json
      - name: Return encrypted status for private review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f=/tmp/knot-titik-buta-schedule-report.json
          if [ -s "$f" ]; then
            node editorial-engine/pipeline/encrypt-diagnostic.mjs editorial-engine/pipeline/titik-buta-schedule-public.pem < "$f"
          else
            echo 'No report was generated; the scheduling step may not have started.'
          fi
