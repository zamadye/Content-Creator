name: Diagnostik Zernio

# ---------------------------------------------------------------------------
#  Kenapa ada di sini: zernio.com tidak dapat dihubungi dari sandbox Arena,
#  tetapi runner GitHub punya internet penuh. Seluruh panggilan Zernio
#  dijalankan di runner, dan hasilnya diterbitkan sebagai anotasi check-run
#  supaya bisa dibaca lewat API (log mentah tidak bisa diunduh dari sandbox).
#
#  CATATAN PENTING soal pemicu:
#  `workflow_dispatch` hanya bisa dipanggil kalau workflow ini sudah ada di
#  branch default (main). Selama perubahan masih berada di branch kerja, satu-
#  satunya cara menjalankannya adalah lewat `push`. Karena itu workflow ini
#  dipicu push ke branch mana pun yang menyentuh tools/publish/**, dan hanya
#  membaca (tidak mengunggah apa pun).
#
#  JANGAN menambahkan pemicu pull_request / pull_request_target: workflow ini
#  memakai secret, dan PR dari fork tidak boleh punya akses ke sana.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/zernio-check.yml'
      - 'the-last-signal/tools/publish/**'
      - 'the-last-signal/publish-queue/**.check'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zernio-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Cek kunci, akun, kanal YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}

    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sembunyikan nilai rahasia dari log
        run: |
          set -euo pipefail
          [ -n "${ZERNIO_API_KEY:-}" ] && echo "::add-mask::${ZERNIO_API_KEY}"
          [ -n "${ZERNIO_KEY:-}" ] && echo "::add-mask::${ZERNIO_KEY}"
          exit 0

      - name: Pasang SDK Zernio
        working-directory: the-last-signal/tools/publish
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Jalankan diagnostik
        working-directory: the-last-signal/tools/publish
        run: node zernio-check.mjs

      - name: Publikasikan laporan sebagai artefak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zernio-check
          path: the-last-signal/report/zernio-check.json
          if-no-files-found: warn
