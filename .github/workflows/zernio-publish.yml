name: Publikasikan ke YouTube

# ---------------------------------------------------------------------------
#  Kenapa di sini: zernio.com tidak dapat dihubungi dari sandbox, runner Actions
#  punya internet penuh. Video diangkut lewat repo (the-last-signal/releases/),
#  diunggah ke storage Zernio dari runner, lalu dipublikasikan ke YouTube.
#
#  Antrean = file JSON baru di the-last-signal/publish-queue/. Satu file = satu
#  video = satu kali jalan. File yang sudah ada tidak diproses ulang, jadi
#  retry tidak akan menghasilkan unggahan ganda.
#
#  Gerbang QC ada di zernio-publish.mjs: kalau resolusi/fps/durasi/codec/
#  loudness/true peak/ukuran gagal, proses berhenti SEBELUM ada byte yang
#  diunggah ke Zernio.
#
#  JANGAN menambahkan pemicu pull_request / pull_request_target.
# ---------------------------------------------------------------------------

on:
  push:
    paths:
      - 'the-last-signal/publish-queue/*.json'
  workflow_dispatch:
    inputs:
      request:
        description: 'Path permintaan (mis. the-last-signal/publish-queue/2026-11-04T04-30-LS-0002.json)'
        required: true
      konfirmasi:
        description: 'Ketik PUBLISH untuk benar-benar mengunggah'
        required: true
        default: 'tidak'

permissions:
  contents: read

concurrency:
  group: zernio-publish
  cancel-in-progress: false

jobs:
  publish:
    name: QC → upload → publikasi
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
      ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ vars.ZERNIO_YOUTUBE_ACCOUNT_ID }}

    steps:
      - name: Ambil kode
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Pasang Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sembunyikan nilai rahasia dari log
        run: |
          set -euo pipefail
          [ -n "${ZERNIO_API_KEY:-}" ] && echo "::add-mask::${ZERNIO_API_KEY}"
          [ -n "${ZERNIO_KEY:-}" ] && echo "::add-mask::${ZERNIO_KEY}"
          exit 0

      - name: Tentukan permintaan yang akan dijalankan
        id: req
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.konfirmasi }}" != "PUBLISH" ]; then
              echo "::error::Konfirmasi tidak bernilai PUBLISH — dibatalkan."
              exit 1
            fi
            REQ="${{ inputs.request }}"
          else
            # Hanya berkas berstatus "requested" yang dihitung sebagai permintaan.
            # Berkas "held" (dijadwalkan) boleh ikut berubah pada push yang sama
            # tanpa memicu unggahan — itu yang membuat antrean bisa disiapkan
            # lebih awal tanpa melanggar aturan satu-unggahan-per-jalan.
            CHANGED=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'the-last-signal/publish-queue/*.json')
            READY=""
            for f in $CHANGED; do
              [ -f "$f" ] || continue
              ST=$(node -e "try{console.log(require('./'+process.argv[1]).status ?? '')}catch(e){console.log('')}" "$f")
              if [ "$ST" = "requested" ]; then READY="$READY $f"; fi
            done
            COUNT=$(echo $READY | wc -w | tr -d ' ')
            if [ "$COUNT" = "0" ]; then
              echo "::notice::Tidak ada berkas berstatus requested pada push ini — tidak ada yang diunggah."
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            REQ=$(echo $READY | awk '{print $1}')
          fi

          if [ -z "${REQ:-}" ]; then
            echo "::error::Tidak ada permintaan publikasi baru pada push ini."
            exit 1
          fi
          # Hanya satu permintaan per jalan: jeda antar-upload dijaga manusia,
          # bukan oleh loop di dalam workflow.
          if [ "${{ github.event_name }}" = "push" ] && [ "${COUNT:-1}" -gt 1 ]; then
            echo "::error::$COUNT permintaan berstatus requested dalam satu push. Lepas satu per satu agar jeda antar-video terjaga."
            exit 1
          fi
          [ -f "$REQ" ] || { echo "::error::File permintaan tidak ada: $REQ"; exit 1; }
          echo "request=$REQ" >> "$GITHUB_OUTPUT"
          echo "::notice::Permintaan: $REQ"

      - name: Verifikasi berkas media ada di checkout
        if: steps.req.outputs.skip != '1'
        run: |
          set -euo pipefail
          MEDIA=$(node -e "const r=require('./' + process.argv[1]);console.log(r.media ?? 'the-last-signal/releases/' + r.episodeId + '.mp4')" "${{ steps.req.outputs.request }}")
          echo "::notice::Media: $MEDIA"
          [ -f "$MEDIA" ] || { echo "::error::Media tidak ada di repo: $MEDIA (commit dulu filenya ke the-last-signal/releases/)"; exit 1; }
          ls -la "$MEDIA"

      - name: Pasang ffmpeg (gerbang QC memakai ffmpeg, tidak tersedia default di runner)
        if: steps.req.outputs.skip != '1'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Pasang SDK Zernio
        if: steps.req.outputs.skip != '1'
        working-directory: the-last-signal/tools/publish
        run: npm install --no-audit --no-fund --loglevel=error

      - name: QC + unggah + publikasikan
        if: steps.req.outputs.skip != '1'
        working-directory: the-last-signal/tools/publish
        run: node zernio-publish.mjs --request "$REQ"
        env:
          REQ: ${{ steps.req.outputs.request }}

      - name: Publikasikan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-report
          path: the-last-signal/report/publish-*.json
          if-no-files-found: warn
